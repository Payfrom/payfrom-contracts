[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.23"
evm_version = "paris"  # Compatible with all chains
optimizer = true
optimizer_runs = 1000  # High runs = lower deployment cost, slightly higher execution cost
via_ir = false  # Can enable for better optimization, but slower compilation

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

# Gas reporting
gas_reports = ["PayFromRouter"]

# Formatter settings
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"
single_line_statement_blocks = "preserve"

# RPC endpoints (for deployment)
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"
base_mainnet = "${BASE_MAINNET_RPC}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC}"
arbitrum_mainnet = "${ARBITRUM_MAINNET_RPC}"
op_sepolia = "${OP_SEPOLIA_RPC}"
op_mainnet = "${OP_MAINNET_RPC}"
polygon_amoy = "${POLYGON_AMOY_RPC}"
polygon_mainnet = "${POLYGON_MAINNET_RPC}"

# Etherscan API keys (for verification)
[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.basescan.org/api" }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
arbitrum = { key = "${ETHERSCAN_API_KEY}", url = "https://api.arbiscan.io/api" }
op_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia-optimistic.etherscan.io/api" }
optimism = { key = "${ETHERSCAN_API_KEY}", url = "https://api-optimistic.etherscan.io/api" }
polygon_amoy = { key = "${ETHERSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api" }
polygon = { key = "${ETHERSCAN_API_KEY}", url = "https://api.polygonscan.com/api" }